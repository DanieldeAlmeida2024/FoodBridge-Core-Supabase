name: FoodBridge Supabase - Validação de autorização

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "tests/role-policy.test.ts"
      - ".github/workflows/security-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "tests/role-policy.test.ts"
      - ".github/workflows/security-tests.yml"

jobs:
  role-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar política de autorização sem serviços externos
        run: node --experimental-strip-types --test tests/role-policy.test.ts
